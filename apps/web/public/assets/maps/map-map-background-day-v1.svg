      <path d="M-180 888C168 674 462 704 746 856s562 162 852 20 474-72 668 96"/>
    </g>
    <path d="M0 207.35999999999999H2048M0 944.64H2048" stroke="#d5dde0" stroke-opacity=".06" stroke-width="2"/>
    <rect width="2048" height="1152" fill="url(#map-vignette)"/>
    <rect x="32" y="32" width="1984" height="1088" rx="24" fill="none" stroke="#d5dde0" stroke-opacity=".12" stroke-width="3"/>
